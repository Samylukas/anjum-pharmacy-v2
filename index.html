<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjum Green Pharmacy - POS</title>
    <style>
        :root {
            --primary: #1e3c72;
            --secondary: #2a5298;
            --accent: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f6f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 24px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            background: #e8f8f5;
            color: #27ae60;
            border-radius: 15px;
            font-size: 13px;
            margin-top: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 10px 18px;
            border: none;
            background: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .grid-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-blue { background: #3498db; }
        .btn-orange { background: #e67e22; }
        .btn-red { background: var(--danger); }
        .btn-green { background: var(--accent); }
        .btn-purple { background: #8e44ad; }
        
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background: var(--primary);
            color: #fff;
        }
        .totals-card {
            background: #1a252f;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            text-align: center;
        }
        .totals-card div {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌿 Anjum Green Pharmacy 2026</h1>
        <div class="status-badge" id="netStatus">🟢 Online</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('pos')">🛒 POS & Invoices</button>
        <button class="tab-btn" onclick="switchTab('stock')">🔒 Stock Details</button>
        <button class="tab-btn" onclick="switchTab('add-stock')">➕ Add Inventory</button>
    </div>

    <!-- POS SECTION -->
    <div id="pos" class="section active">
        <div class="grid-actions">
            <button class="btn btn-blue" onclick="syncData()">Sync Data 🔄</button>
            <button class="btn btn-orange" onclick="newInvoice()">New Invoice ➕</button>
            <button class="btn btn-red" onclick="clearInvoice()">Clear 🧹</button>
        </div>

        <div style="margin-bottom: 10px; font-weight: bold;">
            Invoice ID: <span id="invoiceIdDisplay" style="color:var(--primary)">---</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Product Name or Scan..." oninput="handleSearch()">
            <button class="btn btn-purple" onclick="triggerScan()">Scan 📷</button>
        </div>

        <div id="searchResults" style="background:#fff; border:1px solid #ccc; max-height:150px; overflow-y:auto; display:none; margin-bottom:10px;"></div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Product Name</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>

        <div class="totals-card">
            <div>Total: <br><strong id="grandTotal" style="color:#2ecc71; font-size:18px;">0.00 EGP</strong></div>
        </div>
        <br>
        <button class="btn btn-green" style="width: 100%; padding: 15px; font-size: 16px;" onclick="saveInvoice()">Save & Sync Invoice 💾</button>
    </div>

    <!-- STOCK SECTION -->
    <div id="stock" class="section">
        <h3>📦 Inventory Stock</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Barcode</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody id="stockTable"></tbody>
        </table>
    </div>

    <!-- ADD INVENTORY SECTION -->
    <div id="add-stock" class="section">
        <h3>➕ Add New Product</h3>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="prodName">
        </div>
        <div class="form-group">
            <label>Barcode</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="prodBarcode">
                <button class="btn btn-purple" onclick="scanForAdd()">Scan 📷</button>
            </div>
        </div>
        <div class="form-group">
            <label>Price (EGP)</label>
            <input type="number" id="prodPrice">
        </div>
        <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="prodQty">
        </div>
        <button class="btn btn-green" style="width:100%" onclick="saveProduct()">Save Product 📦</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFs0SQAS-P6dO3NrtM9QrJM-51UzBIRGpL5FpKI9DRZtq7Kq-IOLUwwYgMGe4IVzuSTQ/exec";

    let productsDB = [];
    let cart = [];
    let currentInvoiceId = 1001;

    window.onload = function() {
        syncData();
    };

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    async function syncData() {
        document.getElementById('netStatus').innerText = "⏳ Syncing...";
        try {
            let resProd = await fetch(`${SCRIPT_URL}?action=getProducts`, { redirect: 'follow' });
            productsDB = await resProd.json();
            
            let resInv = await fetch(`${SCRIPT_URL}?action=getInvoiceId`, { redirect: 'follow' });
            let invData = await resInv.json();
            currentInvoiceId = invData.nextInvoiceId || 1001;

            document.getElementById('invoiceIdDisplay').innerText = currentInvoiceId;
            document.getElementById('netStatus').innerText = "🟢 Online";
            renderStockTable();
        } catch(e) {
            document.getElementById('netStatus').innerText = "🔴 Offline / Error";
            console.error(e);
        }
    }

    function handleSearch() {
        let val = document.getElementById('searchInput').value.trim().toLowerCase();
        let resultsContainer = document.getElementById('searchResults');
        if (!val) { resultsContainer.style.display = 'none'; return; }

        let matches = productsDB.filter(p => 
            p.name.toLowerCase().includes(val) || (p.barcode && p.barcode.toString() === val)
        );

        if (matches.length > 0) {
            resultsContainer.innerHTML = matches.map(p => `
                <div style="padding:8px; border-bottom:1px solid #eee; cursor:pointer;" onclick="addToCart('${p.id}')">
                    ${p.name} - ${p.price} EGP (Stock: ${p.quantity})
                </div>
            `).join('');
            resultsContainer.style.display = 'block';
        } else {
            resultsContainer.style.display = 'none';
        }
    }

    function addToCart(prodId) {
        let prod = productsDB.find(p => p.id == prodId);
        if (!prod) return;

        let exist = cart.find(c => c.id == prodId);
        if (exist) {
            exist.qty += 1;
        } else {
            cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
        }
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchInput').value = '';
        renderCart();
    }

    function renderCart() {
        let html = '';
        let total = 0;
        cart.forEach((item, index) => {
            let itemTotal = item.price * item.qty;
            total += itemTotal;
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.name}</td>
                    <td><input type="number" value="${item.qty}" min="1" style="width:50px" onchange="updateQty(${index}, this.value)"></td>
                    <td>${item.price}</td>
                    <td>${itemTotal.toFixed(2)}</td>
                    <td><button class="btn btn-red" onclick="removeItem(${index})">X</button></td>
                </tr>
            `;
        });
        document.getElementById('cartTable').innerHTML = html;
        document.getElementById('grandTotal').innerText = total.toFixed(2) + " EGP";
    }

    function updateQty(index, val) {
        cart[index].qty = parseInt(val) || 1;
        renderCart();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        renderCart();
    }

    function clearInvoice() {
        cart = [];
        renderCart();
    }

    function newInvoice() {
        clearInvoice();
        syncData();
    }

    async function saveInvoice() {
        if (cart.length === 0) { alert("Cart is empty!"); return; }
        
        let grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        let payload = {
            action: "saveInvoice",
            invoice: {
                id: currentInvoiceId,
                items: cart,
                totalEGP: grandTotal
            }
        };

        document.getElementById('netStatus').innerText = "⏳ Saving...";
        try {
            await fetch(SCRIPT_URL, { 
                method: "POST", 
                body: JSON.stringify(payload),
                redirect: 'follow'
            });
            alert("Invoice Saved Successfully!");
            newInvoice();
        } catch(e) {
            alert("Error saving invoice");
            console.error(e);
        }
    }

    function renderStockTable() {
        let html = productsDB.map(p => `
            <tr>
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>${p.barcode || '-'}</td>
                <td>${p.price}</td>
                <td>${p.quantity}</td>
            </tr>
        `).join('');
        document.getElementById('stockTable').innerHTML = html;
    }

    async function saveProduct() {
        let name = document.getElementById('prodName').value;
        let barcode = document.getElementById('prodBarcode').value;
        let price = document.getElementById('prodPrice').value;
        let qty = document.getElementById('prodQty').value;

        if (!name || !price) { alert("Fill required fields!"); return; }

        let payload = {
            action: "saveProduct",
            product: { name, barcode, price, quantity: qty }
        };

        await fetch(SCRIPT_URL, { 
            method: "POST", 
            body: JSON.stringify(payload),
            redirect: 'follow'
        });
        alert("Product Added!");
        syncData();
        switchTab('stock');
    }

    function triggerScan() {
        let code = prompt("Scan or Enter Barcode:");
        if (code) {
            document.getElementById('searchInput').value = code;
            handleSearch();
        }
    }

    function scanForAdd() {
        let code = prompt("Scan or Enter Barcode:");
        if (code) {
            document.getElementById('prodBarcode').value = code;
        }
    }
</script>
</body>
</html>
