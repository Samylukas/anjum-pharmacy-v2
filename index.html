<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anjum Green Pharmacy 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; overflow-x: hidden; scroll-behavior: smooth; font-size: 14px; }
        .app-container { max-width: 1100px; margin: 15px auto; padding: 0 10px; min-height: 90vh; padding-bottom: 60px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: #fff; color: #7f8c8d; border: 1px solid #e0e0e0; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem; white-space: nowrap; }
        .tab-btn.active { background: #1e3c72; color: #fff; border-color: #1e3c72; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); width: 100%; }
        .section-title { font-weight: 800; color: #1e3c72; font-size: 1.2rem; margin-bottom: 12px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; width: 100%; }
        .form-group { display: flex; flex-direction: column; text-align: right; }
        .form-group label { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; color: #2c3e50; }
        .form-group input, .form-group select { padding: 8px 10px; border: 1px solid #dcdde1; border-radius: 6px; font-size: 0.95rem; outline: none; background: #f8f9fa; font-weight: 600; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; text-align: center; font-size: 0.9rem; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-green { background: #27ae60; } .btn-blue { background: #1e3c72; } .btn-red { background: #e74c3c; } .btn-purple { background: #8e44ad; } .btn-orange { background: #f39c12; } .btn-gray { background: #7f8c8d; }
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; border-radius: 6px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; background: #fff; text-align: center; font-size: 0.9rem; }
        th, td { padding: 8px; border-bottom: 1px solid #eee; }
        th { background: #f39c12; color: white; font-weight: 800; }
        .total-row td { background: #eafaf1 !important; font-weight: 800; font-size: 1rem; text-align: right; border-top: 2px solid #27ae60; }
        #toastStack { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999999; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 350px; }
        .toast { color: white; padding: 12px; border-radius: 6px; font-weight: 700; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .scroll-btn-group { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
        .scroll-btn { width: 40px; height: 40px; border-radius: 50%; background: #f39c12; color: white; border: 2px solid #fff; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="toastStack"></div>

<div class="scroll-btn-group">
    <button class="scroll-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⏫</button>
    <button class="scroll-btn" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">⏬</button>
</div>

<div class="app-container">
    <div class="header-bar">
        <span style="font-weight: 800; color: #1e3c72; font-size: 1.1rem;">🌿 Anjum Green Pharmacy</span>
        <span id="userInfo" style="font-weight: 700;">👤 Admin</span>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="showTab('salesTab', this)">🛒 بيع مباشر</button>
        <button class="tab-btn" onclick="showTab('stockTab', this)">📦 المخزون</button>
        <button class="tab-btn" onclick="showTab('reportsTab', this)">📊 التقارير</button>
    </div>

    <!-- Tab 1: Sales -->
    <div id="salesTab" class="tab-content active">
        <div class="card">
            <h2 class="section-title">🛒 تسجيل عملية بيع</h2>
            <div class="grid-form">
                <div class="form-group"><label>اسم المنتج:</label><input type="text" id="saleProdName" placeholder="اسم المنتج..."></div>
                <div class="form-group"><label>الكمية:</label><input type="number" id="saleQty" value="1" min="1"></div>
                <div class="form-group"><label>السعر:</label><input type="number" id="salePrice" placeholder="0.00"></div>
            </div>
            <button class="btn btn-green" style="width:100%; margin-top:12px;" onclick="addSale()">حفظ العملية 💾</button>
        </div>
    </div>

    <!-- Tab 2: Stock -->
    <div id="stockTab" class="tab-content">
        <div class="card">
            <h2 class="section-title">📦 إضافة للمخزون</h2>
            <div class="grid-form">
                <div class="form-group"><label>اسم المنتج:</label><input type="text" id="stockProdName" placeholder="اسم المنتج..."></div>
                <div class="form-group"><label>الكمية:</label><input type="number" id="stockQty" value="10"></div>
                <div class="form-group"><label>سعر الجملة:</label><input type="number" id="stockPrice" placeholder="0.00"></div>
            </div>
            <button class="btn btn-blue" style="width:100%; margin-top:12px;" onclick="addStock()">إضافة للمخزون 📦</button>
        </div>
    </div>

    <!-- Tab 3: Reports -->
    <div id="reportsTab" class="tab-content">
        <div class="card">
            <h2 class="section-title">📊 تقارير المبيعات</h2>
            <div class="grid-form">
                <div class="form-group"><label>من تاريخ:</label><input type="date" id="repFrom"></div>
                <div class="form-group"><label>إلى تاريخ:</label><input type="date" id="repTo"></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-blue" style="flex:1;" onclick="fetchReports()">بحث 🔍</button>
                <button class="btn btn-green" style="flex:1;" onclick="exportToExcel()">إكسيل 📊</button>
                <button class="btn btn-red" style="flex:1;" onclick="downloadDirectPDF()">طباعة / PDF 📄</button>
            </div>

            <div id="reportPrintArea" class="table-responsive" style="margin-top:15px;">
                <h3 id="printReportTitle" style="text-align:center; color:#1e3c72; margin-bottom:10px; display:none;">تقرير المبيعات</h3>
                <table id="reportsTable">
                    <thead>
                        <tr><th>#</th><th>التاريخ</th><th>البيان / المشوار</th><th>المبلغ</th></tr>
                    </thead>
                    <tbody></tbody>
                    <tfoot></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let salesDB = JSON.parse(localStorage.getItem('pharm_sales') || '[]');

    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function addSale() {
        const name = document.getElementById('saleProdName').value.trim();
        const qty = parseFloat(document.getElementById('saleQty').value) || 0;
        const price = parseFloat(document.getElementById('salePrice').value) || 0;
        if(!name || price <= 0) return toast('⚠️ أدخل البيانات بشكل صحيح', 'warn');

        const sale = { id: salesDB.length + 1, date: new Date().toISOString().slice(0,10), desc: `${name} (عدد: ${qty})`, amt: price * qty };
        salesDB.push(sale);
        localStorage.setItem('pharm_sales', JSON.stringify(salesDB));
        toast('✅ تم حفظ العملية!', 'success');
        document.getElementById('saleProdName').value = '';
    }

    function addStock() {
        toast('✅ تم تحديث المخزون!', 'success');
    }

    function fetchReports() {
        const tbody = document.querySelector('#reportsTable tbody');
        const tfoot = document.querySelector('#reportsTable tfoot');
        const fDate = document.getElementById('repFrom').value;
        const tDate = document.getElementById('repTo').value;

        tbody.innerHTML = '';
        let total = 0;
        let count = 0;

        salesDB.forEach((r) => {
            if ((!fDate || r.date >= fDate) && (!tDate || r.date <= tDate)) {
                count++;
                total += r.amt;
                tbody.innerHTML += `<tr><td>${count}</td><td style="direction:ltr;">${r.date}</td><td>${r.desc}</td><td style="font-weight:bold;">${r.amt.toFixed(2)}</td></tr>`;
            }
        });

        if (count === 0) {
            tbody.innerHTML = '<tr><td colspan="4">لا توجد بيانات للفترة المحددة</td></tr>';
            tfoot.innerHTML = '';
        } else {
            tfoot.innerHTML = `<tr class="total-row"><td colspan="3">الإجمالي</td><td style="direction:ltr;">${total.toFixed(2)}</td></tr>`;
        }
        document.getElementById('printReportTitle').style.display = 'block';
    }

    function downloadDirectPDF() {
        const element = document.getElementById('reportPrintArea');
        if (!element || salesDB.length === 0) return toast('⚠️ لا توجد بيانات للطباعة', 'warn');
        
        toast('⏳ جاري التحضير...', 'info');
        const opt = { margin: 0.3, filename: `Report_${Date.now()}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save().then(() => toast('✅ تم التنزيل!', 'success'));
    }

    function exportToExcel() {
        const table = document.getElementById('reportsTable');
        if (!table) return toast('⚠️ لا توجد بيانات', 'warn');
        const wb = XLSX.utils.table_to_book(table, { sheet: "Sales_Report" });
        XLSX.writeFile(wb, `Sales_Report_${Date.now()}.xlsx`);
        toast('✅ تم التصدير!', 'success');
    }

    function toast(msg, type='info') {
        const stack = document.getElementById('toastStack');
        const el = document.createElement('div');
        el.className = 'toast';
        el.style.backgroundColor = type === 'error' ? '#e74c3c' : (type === 'success' ? '#27ae60' : '#1e3c72');
        el.innerText = msg;
        stack.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    window.onload = () => {
        const today = new Date().toISOString().slice(0,10);
        document.getElementById('repFrom').value = today;
        document.getElementById('repTo').value = today;
    };
</script>
</body>
</html>
