name: Build Android APK & Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1️⃣ وظيفة بناء تطبيق الأندرويد APK
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/
          cp -r *.js www/ 2>/dev/null || true
          cp -r *.css www/ 2>/dev/null || true

      - name: Install Dependencies & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/barcode-scanner@latest --legacy-peer-deps

      - name: Create Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.anjum.pharmacy",
            "appName": "Anjum Pharmacy",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Set Min SDK Version to 26
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 26/g' android/variables.gradle || true
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/g' android/variables.gradle || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      # 🔥 الخطوة السحرية لإصلاح خطأ سيرفرات Google/Kotlin وتثبيت النسخة المستقرة 🔥
      - name: Fix Kotlin 2.2.0 Bug
        run: |
          cd android
          cat <<EOF > build.gradle.tmp
          buildscript {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion('1.9.24')
                      }
                  }
              }
          }
          EOF
          cat build.gradle >> build.gradle.tmp
          mv build.gradle.tmp build.gradle

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anjum-Pharmacy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 2️⃣ وظيفة نشر الموقع على GitHub Pages
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
