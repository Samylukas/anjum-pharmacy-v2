name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Dependencies & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/barcode-scanner

      - name: Initialize Capacitor Project
        run: |
          npx cap init "Anjum Pharmacy" "com.anjum.pharmacy" --web-dir www
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anjum-Pharmacy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
