name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Dependencies & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/barcode-scanner@latest --legacy-peer-deps

      - name: Create Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.anjum.pharmacy",
            "appName": "Anjum Pharmacy",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anjum-Pharmacy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
